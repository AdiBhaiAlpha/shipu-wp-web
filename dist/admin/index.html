<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070c" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Admin — ShiPu WP</title>
    <meta name="description" content="ShiPu WP payment verification console." />

    <!--
      Optional deploy-time backend override for the console.
      <meta name="shipu-backend" content="https://shipu-wp-api.onrender.com" />
    -->

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070c'/%3E%3Crect x='12' y='26' width='40' height='4' fill='%2322d3ee'/%3E%3Crect x='12' y='34' width='28' height='4' fill='%23c084fc'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <!-- Relative so the console works from any sub-path -->
    <link rel="stylesheet" href="../assets/style.css" />
  </head>

  <body class="admin-body">
    <div class="shell">
      <header class="site-header admin-header">
        <div class="container header-inner">
          <a class="brand" href="../index.html" aria-label="Back to the ShiPu WP site">
            <span class="brand-mark" aria-hidden="true">SP</span>
            <span>
              <span class="brand-name">SHIPU WP</span>
              <span class="brand-sub">admin console</span>
            </span>
          </a>

          <nav class="site-nav" aria-label="Admin">
            <span class="admin-tab is-active" data-admin-tab="payments">Payments</span>
            <span class="admin-tab" data-admin-tab="stats">Stats</span>
            <span class="guard-badge is-locked" id="guard-badge">
              <span id="guard-label">LOCKED</span>
            </span>
            <span class="header-account">
              <a class="btn btn-tiny btn-ghost" href="../index.html#/">Site</a>
            </span>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container" id="admin-main">
          <p class="busy"><span class="spinner" aria-hidden="true"></span> Checking credentials…</p>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container admin-foot">
          <span>ShiPu WP admin console · <span id="admin-version">v1.0.0</span></span>
          <span>API: <span id="api-endpoint">not configured</span></span>
        </div>
      </footer>
    </div>

    <script type="module" src="../assets/admin.js"></script>
  </body>
</html>
