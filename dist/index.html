<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070c" />

    <title>ShiPu WP — AI-powered WhatsApp Assistant</title>
    <meta
      name="description"
      content="ShiPu WP automatically generates intelligent replies to your WhatsApp messages using AI. Free daily usage, unlimited replies on Pro."
    />
    <meta name="author" content="ShiPu WP" />
    <link rel="canonical" href="./index.html" />

    <!--
      Optional deploy-time backend override.
      Leave the content empty to use BACKEND_URL from assets/firebase-config.js.
      Fill it in here instead if you prefer not to edit the module:
      <meta name="shipu-backend" content="https://shipu-wp-api.onrender.com" />
    -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShiPu WP — AI-powered WhatsApp Assistant" />
    <meta
      property="og:description"
      content="Automatically generate intelligent replies to your WhatsApp messages using AI."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon: a CSS-free inline glyph so there is no binary asset -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070c'/%3E%3Crect x='10' y='20' width='10' height='24' fill='%2322d3ee'/%3E%3Crect x='24' y='20' width='10' height='24' fill='%2322d3ee'/%3E%3Crect x='38' y='20' width='10' height='24' fill='%23c084fc'/%3E%3Crect x='50' y='20' width='4' height='24' fill='%23c084fc'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="./assets/style.css" />
  </head>

  <body>
    <div class="shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="brand" href="#/" aria-label="ShiPu WP home">
            <span class="brand-mark" aria-hidden="true">SP</span>
            <span>
              <span class="brand-name">SHIPU WP</span>
              <span class="brand-sub">ai assistant</span>
            </span>
          </a>

          <button
            class="nav-toggle"
            id="nav-toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false"
          >
            MENU
          </button>

          <nav class="site-nav" aria-label="Primary">
            <a class="nav-link" href="#/" data-nav="/">Home</a>
            <a class="nav-link" href="#/pricing" data-nav="/pricing">Pricing</a>
            <a class="nav-link" href="#/dashboard" data-nav="/dashboard">Dashboard</a>
            <a class="nav-link" href="./admin/index.html" data-nav="admin">Admin</a>
            <span class="header-account">
              <span class="header-handle" id="auth-label"></span>
              <a class="btn btn-tiny btn-ghost" id="auth-action" href="#/login" data-action="login">Login</a>
            </span>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container" id="view">
          <!--
            Every page is rendered into #view by assets/router.js + assets/app.js.
            The fallback below is only what a visitor sees if the module never
            runs (no JavaScript, or the Firebase CDN is blocked).
          -->
          <noscript>
            <div class="stack stack-lg">
              <h1 class="page-title">ShiPu WP</h1>
              <p class="page-lead">AI-powered WhatsApp Assistant.</p>
              <p class="fine-print">
                This site needs JavaScript for sign-in, pricing and the purchase flow. Please enable it and
                reload.
              </p>
            </div>
          </noscript>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <div class="footer-meta">
            <span>© <span id="year">2026</span> ShiPu WP</span>
            <span class="footer-status" id="footer-backend-status">API NOT CONFIGURED</span>
          </div>
          <nav class="footer-links" aria-label="Footer">
            <a href="#/pricing">Pricing</a>
            <a href="#/login">Login</a>
            <a href="#/register">Register</a>
            <a href="./admin/index.html">Admin</a>
          </nav>
        </div>
      </footer>
    </div>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
